
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1264D8">

    <title>Create Account | BINGWAHUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-content">

            <a href="index.html" class="logo">
                <span class="logo-icon">B</span>
                BINGWAHUB
            </a>

            <nav class="navigation">
                <a href="index.html">Home</a>
                <a href="bundles.html">Buy Bundles</a>
                <a href="login.html">Login</a>
            </nav>

        </div>
    </header>

    <main class="categories">

        <div class="container">

            <div class="checkout-card">

                <h2>Create Your Account</h2>

                <p class="section-description">
                    Join BINGWAHUB and enjoy convenient bundle purchases.
                </p>

                <form id="register-form">

                    <div class="form-group">
                        <label for="register-name">Full Name</label>

                        <input
                            type="text"
                            id="register-name"
                            placeholder="Enter your full name"
                            maxlength="100"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-phone">Phone Number</label>

                        <input
                            type="tel"
                            id="register-phone"
                            placeholder="0712345678"
                            maxlength="13"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email Address</label>

                        <input
                            type="email"
                            id="register-email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div id="register-message"
                         class="checkout-message"
                         role="status">
                    </div>

                    <button
                        type="submit"
                        class="primary-button checkout-button">
                        Create Account
                    </button>

                </form>

                <p class="payment-note">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </div>

        </div>

    </main>

    <footer class="site-footer">
        <div class="container">
            <h3>BINGWAHUB</h3>
            <p>Your Bundles. Your Connection.</p>
            <p>© 2026 BINGWAHUB. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>

</body>
</html>
